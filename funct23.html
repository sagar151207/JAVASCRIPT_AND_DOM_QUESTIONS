create a function that calculates the average of three numbers
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function average(a,b,c){
            return (a+b+c)/3
        }
        console.log(average(10,10,10))
    </script>
</body>
</html>
