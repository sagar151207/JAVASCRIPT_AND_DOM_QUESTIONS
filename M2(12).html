<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <script>

        a = Number(prompt("Enter First Number:"))
        b = Number(prompt("Enter Second Number:"))
        greater = a > b
        lesser = a < b
        greater_equal = a >= b
        lesser_equal = a <= b
        alert("Greater: " + greater)
        alert("Lesser: "  + lesser)
        alert("Greater than Equal: "  + greater_equal)
        alert("Lesser than equal: " + lesser_equal)
        
    </script>
</body>
</html>
