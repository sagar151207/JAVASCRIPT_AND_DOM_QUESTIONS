<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>

  <body>
    <script>
      let numbers = [10, 20, 30, 40]; //square using map in array
      let newNumbers = (num = numbers.map(function (num) {
        return num * num;
      }));
      console.log(newNumbers);
    </script>
  </body>
